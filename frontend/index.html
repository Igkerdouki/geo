<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AskGaia · Environmental Intelligence</title>
  </head>
  <body>
    <div id="root"><p style="padding:24px">Loading AskGaia…</p></div>
    <script>
      window.addEventListener('error', function (event) {
        const root = document.getElementById('root');
        if (root && root.textContent === 'Loading AskGaia…') {
          root.textContent = 'AskGaia failed to start: ' + (event.message || 'A required script could not load. Reload the page.');
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
